[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurola-openarm-teleop"
version = "0.1.2"
description = "OpenArm v1 bimanual teleoperation with licensed Rust retargeting and shared XRT input"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT; robot assets retain their upstream license" }
authors = [{name = "Chuizheng Kong"}]
dependencies = ["numpy", "scipy", "mujoco>=3.3", "eurola-geo-kin-core==0.1.2", "eurola-xrt-devices==0.1.2"]

[project.optional-dependencies]
hardware = ["openarm-can==1.4.1; sys_platform == 'linux'"]
devices = ["eurola-xrt-devices[xr,recording]==0.1.2"]
mediapipe = ["eurola-xrt-devices[mediapipe]==0.1.2"]
test = ["pytest"]

[project.scripts]
openarm-teleop = "openarm_teleop.demos.teleop:main"

[tool.geo-kin]
product = "openarm"

[tool.setuptools.packages.find]
include = ["openarm_teleop*"]

[tool.setuptools.package-data]
openarm_teleop = ["assets/v1/*.xml", "assets/v1/*.txt", "assets/v1/meshes/**/*", "assets/specs/*.npz", "assets/sample_motion/*.npz", "assets/sample_motion/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
